<!DOCTYPE html>
<html>
<head>

<title>SidhuEdu ERP Login</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#e8f5e9,#b3e5fc);
}


.login-box{

    width:360px;
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 20px #999;

}


h2{
    color:#008000;
    margin-bottom:5px;
}


h3{
    color:#064663;
}


input{

    width:95%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;

}


button{

    width:95%;
    padding:12px;
    margin-top:15px;
    background:#008000;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}


button:hover{

    background:#006400;

}


.footer{

    margin-top:20px;
    color:gray;
    font-size:13px;

}


</style>


<script>

function login(){

let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;


if(user=="" || pass==""){

alert("Please enter username and password");

}

else{

window.location.href="dashboard.html";

}

}


</script>


</head>


<body>


<div class="login-box">


<h2>🌈 Rainbow Play-Way Pre School</h2>

<p>📍 Bhucho Mandi</p>


<h3>SidhuEdu ERP v1.0</h3>


<input id="username" type="text" placeholder="Username">


<input id="password" type="password" placeholder="Password">


<button onclick="login()">LOGIN</button>



<div class="footer">

Powered by SidhuEdu ERP<br>

© 2026 Rainbow Play-Way Pre School

</div>


</div>


</body>
</html>
