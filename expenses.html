<!DOCTYPE html>
<html>
<head>

<style>

body{
font-family:Arial;

}

.container{

}

}

<body>

<div class="container">

<h2>🌈 Rainbow Play-Way Pre School</h2>

<h3>💸 Expense Entry</h3>

<input id="expenseDate" type="date">

<select id="expenseType">

<option>Salary</option>

<button onclick="saveExpenseData()">
SAVE EXPENSE
</button>

<button onclick="location.href='dashboard.html'">
⬅ Back Dashboard
</button>

</div>

<script src="database.js"></script>

<script>

    function saveExpenseData(){

let expense={

date:
document.getElementById("expenseDate").value,

document.getElementById("expenseType").value,

document.getElementById("expenseRemark").value

if(expense.type=="" || expense.amount==""){

}

saveExpense(expense);

}

</script>

</body>
