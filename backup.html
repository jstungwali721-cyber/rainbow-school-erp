<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Backup - SidhuEdu ERP</title>

<style>

body{
font-family:Arial;
background:#f4f8fb;
margin:0;
}

.header{
background:green;
color:white;
text-align:center;
padding:15px;
}

.container{
width:90%;
max-width:500px;
margin:30px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
text-align:center;
}

button{
width:100%;
padding:12px;
margin:10px 0;
background:green;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:darkgreen;
}

.footer{
text-align:center;
margin-top:20px;
color:gray;
}

</style>

</head>

<body>

<div class="header">

<h2>💾 Backup</h2>

<p>Rainbow Play-Way Pre School</p>

</div>

<div class="container">

<h3>Database Backup</h3>

<p>Create or Restore your local data.</p>

<button onclick="backupData()">
📥 Create Backup
</button>

<button onclick="restoreData()">
📤 Restore Backup
</button>

<button onclick="location.href='dashboard.html'">
⬅ Back to Dashboard
</button>

</div>

<div class="footer">

Powered by SidhuEdu ERP

</div>

<script>

function backupData(){

let data = localStorage.getItem("students") || "[]";

localStorage.setItem("students_backup", data);

alert("Backup Created Successfully!");

}

function restoreData(){

let backup = localStorage.getItem("students_backup");

if(backup){

localStorage.setItem("students", backup);

alert("Backup Restored Successfully!");

}else{

alert("No Backup Found!");

}

}

</script>

</body>

</html>
